version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: airline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../:/workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: airline-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../:/workspace
    entrypoint: ["liquibase"]
    command:
      - --url=jdbc:postgresql://postgres:5432/airline_db
      - --username=postgres
      - --password=postgres
      - --changeLogFile=/workspace/liquibase/changelog-master.xml
      - update

volumes:
  postgres_data:
